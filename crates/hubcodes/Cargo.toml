[package]
name = "hubcodes"
version = "0.1.40"
edition = "2021"
rust-version = "1.88"
description = "Full-TUI canvas for orchestrating multiple AI coding agents on top of tmux"
license = "MIT"

[[bin]]
name = "hubcodes"
path = "src/main.rs"

[dependencies]
hubcodes-core = { path = "../hubcodes-core" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "macros", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ansi-to-tui = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
anyhow = "1.0"
regex = "1"
dirs = "6"
ureq = "3"
