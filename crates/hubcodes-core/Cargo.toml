[package]
name = "hubcodes-core"
version = "0.1.40"
edition = "2021"
rust-version = "1.88"
description = "Model, tmux backend and provider registry shared by hubcodes clients"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
anyhow = "1.0"
dirs = "6"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
regex = "1"
