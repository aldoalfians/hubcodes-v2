[package]
name = "hubcodes-desktop"
version = "0.1.40"
edition = "2021"
rust-version = "1.88"
description = "hubcodes desktop: canvas for orchestrating AI coding agents on tmux"
license = "MIT"

[lib]
name = "hubcodes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hubcodes-core = { path = "../../crates/hubcodes-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1"
base64 = "0.22"
dirs = "6"
tauri-plugin-notification = "2"
libc = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
