# token = "${keychain:connection:hubstudio}"   # or ${JIRA_TOKEN} from the environment
# query = "project = PE AND status = \"Selected for Development\" AND assignee = currentUser() ORDER BY priority"
# instruction = "/jira-task {key}"      # {key} {title} {url} {description}
# role = "software engineer"
# on_start = "In Development"
# on_done = "In Review"
# comment_on_done = true
# limit = 2
# poll_minutes = 2
#
# [[tracker]]                           # pull requests that ask you for a review
# name = "reviews"
# kind = "github-review"
# repo = ""                             # every repository; or "owner/repo", or "owner/*"
# role = "reviewer"                     # one review per idle reviewer agent; the rest queue
# limit = 10
# comment_on_done = false               # the agent posts its own review
# rereview = true                       # the author pushed after our review: look at what changed
#
# [[tracker]]                           # comments on your own pull requests: fix, push, answer, repeat
# name = "feedback"
# kind = "github-feedback"
# role = "pr-fixer"                     # one round per pull request at a time
# since = "2026-11-21"                  # ignore older feedback
# ignore = "some-auto-reviewer"         # logins whose comments never start a round; "checks" / "conflicts" turn off failed-check and merge-conflict rounds
# limit = 10
# comment_on_done = false               # the agent answers each thread itself
