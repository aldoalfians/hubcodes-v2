# ---------------------------------------------------------------- accounts
# Connected once in Settings → Accounts; trackers and knowledge sources copy
# the site, email and token reference from here. A token pasted in Settings
# is stored in the macOS Keychain and the file only says where:
# ${keychain:NAME}. From a terminal: `hubcodes secret set NAME` (value on stdin).
# [[connection]]
# name = "hubstudio"
# kind = "atlassian"                    # atlassian | plane | github
# url = "https://hubstudio.atlassian.net"
# email = "me@hubstudio.id"
# token = "${keychain:connection:hubstudio}"

# ---------------------------------------------------------------- issue trackers
# [[tracker]]
# name = "jira"
